name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -type f))"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Cross-build smoke
        run: |
          GOOS=linux GOARCH=amd64 go build -o /tmp/poke-linux-amd64 ./cmd/poke
          GOOS=darwin GOARCH=amd64 go build -o /tmp/poke-darwin-amd64 ./cmd/poke
          GOOS=darwin GOARCH=arm64 go build -o /tmp/poke-darwin-arm64 ./cmd/poke
          GOOS=windows GOARCH=amd64 go build -o /tmp/poke-windows-amd64.exe ./cmd/poke

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Build
        run: go build ./cmd/poke

  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: Verify archive contents
        run: bash scripts/verify-release-archives.sh
