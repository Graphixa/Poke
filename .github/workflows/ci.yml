name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Verify formatting
        run: |
          files="$(gofmt -l $(find . -name '*.go' -type f))"
          if [ -n "$files" ]; then
            echo "gofmt needed on:"
            echo "$files"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.1
          staticcheck ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -exclude=G104,G115,G301,G304,G306,G404 ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Cross-build smoke
        run: |
          GOOS=linux GOARCH=amd64 go build -o /tmp/poke-linux-amd64 ./cmd/poke
          GOOS=darwin GOARCH=amd64 go build -o /tmp/poke-darwin-amd64 ./cmd/poke
          GOOS=darwin GOARCH=arm64 go build -o /tmp/poke-darwin-arm64 ./cmd/poke
          GOOS=windows GOARCH=amd64 go build -o /tmp/poke-windows-amd64.exe ./cmd/poke

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: Build
        run: go build ./cmd/poke

  release-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true
      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
      - name: Verify archive contents
        run: bash scripts/verify-release-archives.sh
