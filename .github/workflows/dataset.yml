name: Dataset

on:
  schedule:
    # 16:00 UTC on the 1st. Compares commits only. Does not build a gzip or tag a release.
    - cron: "0 16 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Compare api-data commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          live="$(gh api repos/PokeAPI/api-data/commits/master --jq .sha)"
          have="$(tr -d '[:space:]' < internal/bundled/upstream.sha)"
          echo "api-data $live"
          echo "recorded $have"
          if [ "$live" = "$have" ]; then
            echo "snapshot record matches"
            exit 0
          fi
          title="Dataset snapshot is behind api-data ${live}"
          open="$(gh issue list --state open --search "$live in:title" --json number --jq 'length')"
          if [ "$open" != "0" ]; then
            echo "issue already open"
            exit 0
          fi
          body="$(printf 'api-data master is %s.\ninternal/bundled/upstream.sha records %s.\n\nThis job does not rebuild the gzip and does not tag a release.\nPack a new internal/bundled/dataset.tar.gz, set upstream.sha to that commit, and open a pull request.\n' "$live" "$have")"
          gh issue create --title "$title" --body "$body"
