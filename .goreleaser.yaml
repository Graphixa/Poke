# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: poke

before:
  hooks:
    - go mod tidy
    # .syso must land in cmd/poke (single binary; pokedex is an install-time alias).
    - go run github.com/tc-hib/go-winres@v0.3.3 make --in build/winres.json --out cmd/poke/rsrc --arch amd64,arm64 --file-version {{.Major}}.{{.Minor}}.{{.Patch}}.0 --product-version {{.Major}}.{{.Minor}}.{{.Patch}}.0
    # Repack when POKE_DATASET_DIR is set, then refuse a fixture snapshot.
    - go run ./scripts/pack_dataset.go -release

builds:
  - id: poke
    main: ./cmd/poke
    binary: poke
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - >-
        -s -w
        -X github.com/Graphixa/Poke/pkg/version.Version={{.Version}}
        -X github.com/Graphixa/Poke/pkg/version.Commit={{.Commit}}
        -X github.com/Graphixa/Poke/pkg/version.Date={{.Date}}

archives:
  - id: default
    ids:
      - poke
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    # FontGet-compatible: poke_<ver>_<os>_<arch>.tar.gz|zip (lowercase os/arch)
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\(.+\))?!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs(\(.+\))?!?:.+$'
      order: 2
    - title: Others
      order: 999
  filters:
    exclude:
      - '^chore(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^build(\(.+\))?:'
      - '^Merge pull request'
      - '^Merge branch'

release:
  draft: false
  prerelease: auto
  name_template: "poke {{.Version}}"

# Homebrew Cask (macOS) — Graphixa/homebrew-tap
homebrew_casks:
  - name: poke
    repository:
      owner: Graphixa
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/Graphixa/Poke"
    description: "Cross-platform terminal Pokédex powered by PokeAPI"
    license: "GPL-3.0"
    ids:
      - default
    binaries:
      - poke
    hooks:
      post:
        # Declarative steps (goreleaser v2.19+). Alias pokedex -> poke on PATH.
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/poke"]
          end
          run "/bin/ln", args: ["-sf", "#{HOMEBREW_PREFIX}/bin/poke", "#{HOMEBREW_PREFIX}/bin/pokedex"]
        uninstall_steps: |
          remove "#{HOMEBREW_PREFIX}/bin/pokedex"

# Winget — auto-PR to microsoft/winget-pkgs via Graphixa/winget-pkgs fork
winget:
  - name: Poke
    publisher: Graphixa
    short_description: "Cross-platform terminal Pokédex powered by PokeAPI"
    license: "gpl-3.0"
    ids:
      - default
    goamd64: v1
    package_identifier: Graphixa.Poke
    commit_msg_template: "{{ .PackageIdentifier }}: {{ .Tag }}"
    url_template: "https://github.com/Graphixa/Poke/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    path: manifests/g/Graphixa/Poke/{{.Version}}
    homepage: "https://github.com/Graphixa/Poke"
    description: "Cross-platform terminal Pokédex powered by PokeAPI. Browse with a keyboard-first TUI, or look up stats and evolution chains from the command line."
    license_url: "https://github.com/Graphixa/Poke/blob/main/LICENSE"
    publisher_url: "https://github.com/Graphixa"
    publisher_support_url: "https://github.com/Graphixa/Poke/issues"
    # Keep short: winget schema caps ReleaseNotes at 10000 chars; full changelogs fail validate.
    release_notes: "poke {{ .Version }} — terminal Pokédex. See the GitHub release for details."
    release_notes_url: "https://github.com/Graphixa/Poke/releases/tag/v{{.Version}}"
    copyright: "Copyright (c) Graphixa"
    copyright_url: "https://github.com/Graphixa/Poke/blob/main/LICENSE"
    installation_notes: "poke will be available on PATH. Run 'poke --help' to get started. (pokedex is an optional alias from the install script / Homebrew.)"
    tags:
      - pokemon
      - pokedex
      - pokeapi
      - cli
      - tui
      - terminal
      - cross-platform
    repository:
      owner: Graphixa
      name: winget-pkgs
      branch: "poke-{{ .Version }}"
      token: "{{ .Env.WINGET_PR_TOKEN }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

snapshot:
  version_template: "{{ incpatch .Version }}-next"
